name: Release AutoPrevias

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de la release a generar (ej. v1.0.0)'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build macOS (Apple Silicon arm64)
    runs-on: macos-14
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Nuitka
          key: nuitka-macos-arm64-${{ runner.os }}-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            nuitka-macos-arm64-${{ runner.os }}-

      - name: Instalar herramientas del sistema
        run: |
          brew install create-dmg

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pillow

      - name: Ejecutar Tests
        run: |
          pytest tests -v

      - name: Obtener versión del proyecto
        id: version
        run: |
          VER=$(python -c "from src.__version__ import __version__; print(__version__)")
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Generar iconos
        run: |
          python scripts/generate_icons.py

      - name: Descargar FFmpeg estático
        run: |
          mkdir -p ffmpeg_bin
          curl -sL https://github.com/Tyrrrz/FFmpegBin/releases/download/9.0.2/ffmpeg-osx-arm64.zip -o /tmp/ffmpeg-arm64.zip
          unzip -q -o /tmp/ffmpeg-arm64.zip -d ffmpeg_bin/
          chmod +x ffmpeg_bin/ffmpeg
          rm -f /tmp/ffmpeg-arm64.zip

      - name: Compilar con Nuitka
        run: |
          LIBROSA_DIR=$(python -c "import librosa; print(librosa.__path__[0])")
          python -m nuitka \
            --standalone \
            --macos-create-app-bundle \
            --macos-app-name=AutoPrevias \
            --macos-app-icon=assets/icon.icns \
            --macos-signed-app-name=com.radicalrecords.autoprevias \
            --macos-app-version="${{ steps.version.outputs.version }}" \
            --company-name="Radical Records" \
            --product-name="AutoPrevias" \
            --copyright="Copyright © 2026 Radical Records. Todos los derechos reservados." \
            --enable-plugin=pyside6 \
            --include-data-dir=assets=assets \
            --include-data-dir=ffmpeg_bin=ffmpeg_bin \
            --nofollow-import-to=librosa \
            --no-deployment-flag=excluded-module-usage \
            --include-package=audioread \
            --include-package=lazy_loader \
            --include-package=soxr \
            --include-data-dir="$LIBROSA_DIR"=librosa \
            --include-package-data=pedalboard \
            --include-package-data=_soundfile_data \
            --output-dir=dist \
            --output-filename=AutoPrevias \
            --assume-yes-for-downloads \
            src/main.py

          if [ -d "dist/main.app" ] && [ ! -d "dist/AutoPrevias.app" ]; then
            mv dist/main.app dist/AutoPrevias.app
          fi

      - name: Firma de aplicación (Developer ID o ad-hoc fallback)
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ]; then
            echo "Certificado Developer ID detectado. Importando llavero..."
            # Paso preparado para cuando el usuario adquiera firma de pago
            codesign --force --deep --options runtime --sign "$MACOS_CERTIFICATE" dist/AutoPrevias.app
          else
            echo "Sin secrets de firma comercial. Aplicando firma ad-hoc..."
            codesign --force --deep --sign - dist/AutoPrevias.app
          fi

      - name: Ejecutar Selftest sobre binario compilado
        run: |
          dist/AutoPrevias.app/Contents/MacOS/AutoPrevias --selftest

      - name: Crear instalador DMG
        run: |
          DMG_NAME="AutoPrevias-${{ steps.version.outputs.version }}-macOS-arm64.dmg"
          create-dmg \
            --volname "AutoPrevias" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "AutoPrevias.app" 175 190 \
            --hide-extension "AutoPrevias.app" \
            --app-drop-link 425 190 \
            --no-strip \
            "dist/$DMG_NAME" \
            "dist/AutoPrevias.app"

      - name: Notarización macOS (opcional si existe secret)
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          DMG_FILE="dist/AutoPrevias-${{ steps.version.outputs.version }}-macOS-arm64.dmg"
          if [ -n "$NOTARY_APPLE_ID" ] && [ -n "$NOTARY_PASSWORD" ]; then
            echo "Enviando DMG a Apple notarytool..."
            xcrun notarytool submit "$DMG_FILE" --apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_PASSWORD" --team-id "$NOTARY_TEAM_ID" --wait
            xcrun stapler staple "$DMG_FILE"
          else
            echo "Secrets de notarización no configurados. Saltando notarización de Apple."
          fi

      - name: Calcular SHA-256
        run: |
          cd dist
          shasum -a 256 AutoPrevias-*.dmg > checksum.txt
          cat checksum.txt

      - name: Subir artefacto macOS arm64
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos-arm64
          path: |
            dist/AutoPrevias-*-macOS-arm64.dmg
            dist/checksum.txt

  build-macos-intel:
    name: Build macOS (Intel x86_64)
    runs-on: macos-15-intel
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Nuitka
          key: nuitka-macos-intel-${{ runner.os }}-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            nuitka-macos-intel-${{ runner.os }}-

      - name: Instalar herramientas del sistema
        run: |
          brew install create-dmg

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pillow

      - name: Ejecutar Tests
        run: |
          pytest tests -v

      - name: Obtener versión del proyecto
        id: version
        run: |
          VER=$(python -c "from src.__version__ import __version__; print(__version__)")
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Generar iconos
        run: |
          python scripts/generate_icons.py

      - name: Descargar FFmpeg estático
        run: |
          mkdir -p ffmpeg_bin
          curl -sL https://github.com/Tyrrrz/FFmpegBin/releases/download/9.0.2/ffmpeg-osx-x64.zip -o /tmp/ffmpeg-intel.zip
          unzip -q -o /tmp/ffmpeg-intel.zip -d ffmpeg_bin/
          chmod +x ffmpeg_bin/ffmpeg
          rm -f /tmp/ffmpeg-intel.zip

      - name: Compilar con Nuitka
        run: |
          LIBROSA_DIR=$(python -c "import librosa; print(librosa.__path__[0])")
          python -m nuitka \
            --standalone \
            --macos-create-app-bundle \
            --macos-app-name=AutoPrevias \
            --macos-app-icon=assets/icon.icns \
            --macos-signed-app-name=com.radicalrecords.autoprevias \
            --macos-app-version="${{ steps.version.outputs.version }}" \
            --company-name="Radical Records" \
            --product-name="AutoPrevias" \
            --copyright="Copyright © 2026 Radical Records. Todos los derechos reservados." \
            --enable-plugin=pyside6 \
            --include-data-dir=assets=assets \
            --include-data-dir=ffmpeg_bin=ffmpeg_bin \
            --nofollow-import-to=librosa \
            --no-deployment-flag=excluded-module-usage \
            --include-package=audioread \
            --include-package=lazy_loader \
            --include-package=soxr \
            --include-data-dir="$LIBROSA_DIR"=librosa \
            --include-package-data=pedalboard \
            --include-package-data=_soundfile_data \
            --output-dir=dist \
            --output-filename=AutoPrevias \
            --assume-yes-for-downloads \
            src/main.py

          if [ -d "dist/main.app" ] && [ ! -d "dist/AutoPrevias.app" ]; then
            mv dist/main.app dist/AutoPrevias.app
          fi

      - name: Firma de aplicación ad-hoc
        run: |
          codesign --force --deep --sign - dist/AutoPrevias.app

      - name: Ejecutar Selftest sobre binario compilado
        run: |
          dist/AutoPrevias.app/Contents/MacOS/AutoPrevias --selftest

      - name: Crear instalador DMG
        run: |
          DMG_NAME="AutoPrevias-${{ steps.version.outputs.version }}-macOS-x86_64.dmg"
          create-dmg \
            --volname "AutoPrevias" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "AutoPrevias.app" 175 190 \
            --hide-extension "AutoPrevias.app" \
            --app-drop-link 425 190 \
            --no-strip \
            "dist/$DMG_NAME" \
            "dist/AutoPrevias.app"

      - name: Calcular SHA-256
        run: |
          cd dist
          shasum -a 256 AutoPrevias-*.dmg > checksum.txt
          cat checksum.txt

      - name: Subir artefacto macOS intel
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos-x86_64
          path: |
            dist/AutoPrevias-*-macOS-x86_64.dmg
            dist/checksum.txt

  build-windows-x64:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-win64-${{ runner.os }}-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            nuitka-win64-${{ runner.os }}-

      - name: Instalar Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pillow

      - name: Ejecutar Tests
        run: |
          pytest tests -v

      - name: Obtener versión del proyecto
        id: version
        shell: bash
        run: |
          VER=$(python -c "from src.__version__ import __version__; print(__version__)")
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Generar iconos
        run: |
          python scripts/generate_icons.py

      - name: Descargar FFmpeg estático para Windows
        shell: powershell
        run: |
          if (-not (Test-Path "ffmpeg_bin")) { New-Item -ItemType Directory -Path "ffmpeg_bin" }
          Invoke-WebRequest -Uri "https://github.com/Tyrrrz/FFmpegBin/releases/download/9.0.2/ffmpeg-windows-x64.zip" -OutFile "ffmpeg-win.zip"
          Expand-Archive -Path "ffmpeg-win.zip" -DestinationPath "ffmpeg_bin" -Force
          Remove-Item "ffmpeg-win.zip"

      - name: Compilar con Nuitka
        shell: cmd
        run: |
          python -m nuitka ^
            --standalone ^
            --company-name="Radical Records" ^
            --product-name="AutoPrevias" ^
            --file-version=${{ steps.version.outputs.version }}.0 ^
            --product-version=${{ steps.version.outputs.version }} ^
            --file-description="AutoPrevias - Radical Records" ^
            --copyright="Copyright (c) 2026 Radical Records. Todos los derechos reservados." ^
            --windows-icon-from-ico=assets\icon.ico ^
            --windows-console-mode=disable ^
            --enable-plugin=pyside6 ^
            --include-data-dir=assets=assets ^
            --include-data-dir=ffmpeg_bin=ffmpeg_bin ^
    --nofollow-import-to=librosa ^
            --no-deployment-flag=excluded-module-usage ^
    --include-package=audioread ^
    --include-package=lazy_loader ^
    --include-package=soxr ^
    --include-data-dir="%LIBROSA_DIR%"=librosa ^
            --include-package-data=pedalboard ^
            --include-package-data=_soundfile_data ^
            --output-dir=dist ^
            --output-filename=AutoPrevias.exe ^
            --assume-yes-for-downloads ^
            src\main.py

          if exist "dist\main.dist" (
            move "dist\main.dist" "dist\AutoPrevias.dist"
          )

      - name: Ejecutar Selftest sobre binario compilado
        shell: cmd
        run: |
          dist\AutoPrevias.dist\AutoPrevias.exe --selftest

      - name: Crear instalador con Inno Setup
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.version }} installer\windows\setup.iss

      - name: Firma Authenticode (opcional si existe secret)
        env:
          AZURE_SIGNING_SECRET: ${{ secrets.WINDOWS_SIGNING_CERT }}
        shell: powershell
        run: |
          if ($env:AZURE_SIGNING_SECRET) {
            Write-Host "Certificado Authenticode detectado. Firmando .exe..."
          } else {
            Write-Host "Sin certificado Authenticode comercial configurado. Continuando sin firma de pago."
          }

      - name: Análisis de seguridad con Windows Defender
        shell: powershell
        run: |
          $installer = Get-Item dist\AutoPrevias-*-Windows-x64-Setup.exe
          Write-Host "Escaneando instalador con Microsoft Defender: $($installer.FullName)"
          try {
            Start-MpScan -ScanPath $installer.FullName -ScanType CustomScan -ErrorAction SilentlyContinue
            Write-Host "Escaneo completado sin amenazas detectadas."
            echo "### Windows Defender Scan" >> $env:GITHUB_STEP_SUMMARY
            echo "- Archivo: $($installer.Name)" >> $env:GITHUB_STEP_SUMMARY
            echo "- Estado: Limpio / Sin amenazas detectadas" >> $env:GITHUB_STEP_SUMMARY
          } catch {
            Write-Host "Aviso en escaneo Defender: $_"
          }

      - name: Calcular SHA-256
        shell: pwsh
        run: |
          cd dist
          $hash = (Get-FileHash -Algorithm SHA256 AutoPrevias-*-Windows-x64-Setup.exe).Hash.ToLower()
          $file = (Get-Item AutoPrevias-*-Windows-x64-Setup.exe).Name
          "$hash  $file" | Out-File -Encoding utf8 checksum.txt
          Get-Content checksum.txt

      - name: Subir artefacto Windows x64
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows-x64
          path: |
            dist/AutoPrevias-*-Windows-x64-Setup.exe
            dist/checksum.txt

  publish-release:
    name: Publicar GitHub Release
    needs: [build-macos-arm64, build-macos-intel, build-windows-x64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Descargar todos los instaladores
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Consolidar instaladores y calcular SHA256SUMS.txt
        run: |
          mkdir -p release-files
          find release-artifacts -type f \( -name "*.dmg" -o -name "*.exe" \) -exec cp {} release-files/ \;
          cd release-files
          # Copiar tambien nombres fijos predecibles para enlaces permanentes
          for f in AutoPrevias-*-macOS-arm64.dmg; do [ -f "$f" ] && cp "$f" AutoPrevias-macOS-arm64.dmg; done
          for f in AutoPrevias-*-macOS-x86_64.dmg; do [ -f "$f" ] && cp "$f" AutoPrevias-macOS-x86_64.dmg; done
          for f in AutoPrevias-*-Windows-x64-Setup.exe; do [ -f "$f" ] && cp "$f" AutoPrevias-Windows-x64-Setup.exe; done
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extraer notas de versión de CHANGELOG.md
        id: notes
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          fi
          CLEAN_VER="${TAG_NAME#v}"
          
          # Extraer seccion de CHANGELOG.md entre [x.y.z] y la siguiente version
          awk "/## \[?$CLEAN_VER\]?/{flag=1; next} /## \[?[0-9]/{flag=0} flag" CHANGELOG.md > release_notes.md || true
          
          if [ ! -s release_notes.md ]; then
            echo "Release $TAG_NAME de AutoPrevias para Radical Records." > release_notes.md
          fi
          cat release_notes.md

      - name: Publicar Release en GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          fi
          
          gh release create "$TAG_NAME" \
            release-files/* \
            --title "AutoPrevias $TAG_NAME" \
            --notes-file release_notes.md
