name: Release AutoPrevias

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de la release a generar (ej. v1.0.0)'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build-macos-arm64:
    name: Build macOS (Apple Silicon arm64)
    runs-on: macos-14
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Nuitka
          key: nuitka-arm64-${{ runner.os }}-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            nuitka-arm64-${{ runner.os }}-

      - name: Instalar create-dmg
        run: |
          brew install create-dmg

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pillow

      - name: Ejecutar Tests
        run: |
          pytest tests -v

      - name: Obtener versión del proyecto
        id: version
        run: |
          VER=$(python -c "from src.__version__ import __version__; print(__version__)")
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Generar iconos
        run: |
          python scripts/generate_icons.py

      - name: Descargar FFmpeg estático para macOS arm64
        run: |
          mkdir -p ffmpeg_bin
          curl -sL https://github.com/Tyrrrz/FFmpegBin/releases/download/9.0.2/ffmpeg-osx-arm64.zip -o ffmpeg.zip
          unzip -q -o ffmpeg.zip -d ffmpeg_bin/
          chmod +x ffmpeg_bin/ffmpeg
          rm -f ffmpeg.zip

      - name: Compilar con Nuitka
        run: |
          LIBROSA_DIR=$(python -c "import librosa; print(librosa.__path__[0])")
          python -m nuitka \
            --standalone \
            --macos-create-app-bundle \
            --macos-app-name=AutoPrevias \
            --macos-app-icon=assets/icon.icns \
            --macos-signed-app-name=com.radicalrecords.autoprevias \
            --macos-app-version="${{ steps.version.outputs.version }}" \
            --company-name="Radical Records" \
            --product-name="AutoPrevias" \
            --copyright="Copyright © 2026 Radical Records. Todos los derechos reservados." \
            --enable-plugin=pyside6 \
            --include-qt-plugins=sensible,multimedia \
            --include-package=PySide6.QtMultimedia \
            --include-data-dir=assets=assets \
            --include-data-dir=ffmpeg_bin=ffmpeg_bin \
            --nofollow-import-to=librosa,pytest,unittest,lazy_loader.tests \
            --no-deployment-flag=excluded-module-usage \
            --include-package=audioread \
            --include-module=lazy_loader \
            --include-module=uuid \
            --include-module=dis \
            --include-module=inspect \
            --include-module=opcode \
            --include-package=soxr \
            --include-package=PIL \
            --include-data-dir="$LIBROSA_DIR"=librosa \
            --include-package-data=pedalboard \
            --include-package-data=_soundfile_data \
            --output-dir=dist \
            --output-filename=AutoPrevias \
            --assume-yes-for-downloads \
            --lto=no \
            --jobs=3 \
            src/main.py

          if [ -d "dist/main.app" ] && [ ! -d "dist/AutoPrevias.app" ]; then
            mv dist/main.app dist/AutoPrevias.app
          fi

      - name: Empaquetar dependencias runtime adicionales
        run: |
          python scripts/bundle_runtime_deps.py "dist/AutoPrevias.app/Contents/MacOS"

      - name: Firma de aplicación (Developer ID o ad-hoc fallback)
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ]; then
            echo "Certificado Developer ID detectado. Importando llavero..."
            codesign --force --deep --options runtime --sign "$MACOS_CERTIFICATE" dist/AutoPrevias.app
          else
            echo "Sin secrets de firma comercial. Aplicando firma ad-hoc..."
            codesign --force --deep --sign - dist/AutoPrevias.app
          fi

      - name: Ejecutar Selftest sobre binario compilado
        run: |
          dist/AutoPrevias.app/Contents/MacOS/AutoPrevias --selftest

      - name: Crear instalador DMG
        run: |
          DMG_NAME="AutoPrevias-${{ steps.version.outputs.version }}-macOS-arm64.dmg"
          DMG_STAGING="dist/dmg_staging"
          rm -rf "$DMG_STAGING"
          mkdir -p "$DMG_STAGING"
          cp -R "dist/AutoPrevias.app" "$DMG_STAGING/"
          create-dmg \
            --volname "AutoPrevias" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "AutoPrevias.app" 175 190 \
            --hide-extension "AutoPrevias.app" \
            --app-drop-link 425 190 \
            --overwrite \
            "dist/$DMG_NAME" \
            "$DMG_STAGING"
          rm -rf "$DMG_STAGING"

      - name: Calcular SHA-256
        run: |
          cd dist
          shasum -a 256 AutoPrevias-*.dmg > checksum.txt
          cat checksum.txt

      - name: Subir artefacto macOS arm64
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos-arm64
          path: |
            dist/AutoPrevias-*-macOS-arm64.dmg
            dist/checksum.txt

  build-windows-x64:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-win64-${{ runner.os }}-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            nuitka-win64-${{ runner.os }}-

      - name: Instalar Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pillow

      - name: Ejecutar Tests
        run: |
          pytest tests -v

      - name: Obtener versión del proyecto
        id: version
        shell: bash
        run: |
          VER=$(python -c "from src.__version__ import __version__; print(__version__)")
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Generar iconos
        run: |
          python scripts/generate_icons.py

      - name: Descargar FFmpeg estático para Windows
        shell: bash
        run: |
          mkdir -p ffmpeg_bin
          curl -sL "https://github.com/Tyrrrz/FFmpegBin/releases/download/9.0.2/ffmpeg-windows-x64.zip" -o ffmpeg-win.zip
          python -m zipfile -e ffmpeg-win.zip ffmpeg_bin/
          rm -f ffmpeg-win.zip
          ls -la ffmpeg_bin/

      - name: Compilar con Nuitka
        shell: cmd
        run: |
          for /f "tokens=*" %%i in ('python -c "import librosa; print(librosa.__path__[0])"') do set LIBROSA_DIR=%%i
          python -m nuitka ^
            --standalone ^
            --company-name="Radical Records" ^
            --product-name="AutoPrevias" ^
            --file-version=${{ steps.version.outputs.version }}.0 ^
            --product-version=${{ steps.version.outputs.version }} ^
            --file-description="AutoPrevias - Radical Records" ^
            --copyright="Copyright (c) 2026 Radical Records. Todos los derechos reservados." ^
            --windows-icon-from-ico=assets\icon.ico ^
            --windows-console-mode=disable ^
            --enable-plugin=pyside6 ^
            --include-qt-plugins=sensible,multimedia ^
            --include-package=PySide6.QtMultimedia ^
            --include-data-dir=assets=assets ^
            --include-data-dir=ffmpeg_bin=ffmpeg_bin ^
            --nofollow-import-to=librosa,pytest,unittest,lazy_loader.tests ^
            --no-deployment-flag=excluded-module-usage ^
            --include-package=audioread ^
            --include-module=lazy_loader ^
            --include-module=uuid ^
            --include-module=dis ^
            --include-module=inspect ^
            --include-module=opcode ^
            --include-package=soxr ^
            --include-package=PIL ^
            --include-data-dir="%LIBROSA_DIR%"=librosa ^
            --include-package-data=pedalboard ^
            --include-package-data=_soundfile_data ^
            --include-package-data=llvmlite ^
            --include-package-data=numba ^
            --output-dir=dist ^
            --output-filename=AutoPrevias.exe ^
            --assume-yes-for-downloads ^
            --lto=no ^
            --jobs=2 ^
            src\main.py

          if exist "dist\main.dist" (
            move "dist\main.dist" "dist\AutoPrevias.dist"
          )

      - name: Empaquetar dependencias runtime adicionales
        shell: cmd
        run: |
          python scripts\bundle_runtime_deps.py "dist\AutoPrevias.dist"

      - name: Copiar llvmlite.dll al bundle (fix Windows ctypes resource path)
        shell: pwsh
        run: |
          $llvmlite_src = python -c "import llvmlite; import os; print(os.path.join(llvmlite.__path__[0], 'binding'))"
          $llvmlite_dll = Join-Path $llvmlite_src "llvmlite.dll"
          $llvmlite_dest = "dist\AutoPrevias.dist\llvmlite\binding"
          if (Test-Path $llvmlite_dll) {
            Write-Host "Copiando llvmlite.dll desde $llvmlite_dll a $llvmlite_dest y raiz"
            New-Item -ItemType Directory -Force -Path $llvmlite_dest | Out-Null
            Copy-Item $llvmlite_dll $llvmlite_dest -Force
            Copy-Item $llvmlite_dll "dist\AutoPrevias.dist\" -Force
            Write-Host "[OK] llvmlite.dll copiado correctamente."
          } else {
            Write-Host "[WARN] llvmlite.dll no encontrado en $llvmlite_src - buscando en site-packages..."
            $sp = python -c "import site; print([p for p in site.getsitepackages() if 'site-packages' in p][0])"
            $alt = Join-Path $sp "llvmlite\binding\llvmlite.dll"
            if (Test-Path $alt) {
              Copy-Item $alt $llvmlite_dest -Force
              Copy-Item $alt "dist\AutoPrevias.dist\" -Force
              Write-Host "[OK] llvmlite.dll encontrado en $alt y copiado."
            } else {
              Write-Host "[ERROR] llvmlite.dll no encontrado en ninguna ruta conocida."
              exit 1
            }
          }

      - name: Ejecutar Selftest sobre binario compilado
        shell: cmd
        run: |
          dist\AutoPrevias.dist\AutoPrevias.exe --selftest

      - name: Crear instalador con Inno Setup
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.version }} installer\windows\setup.iss

      - name: Análisis de seguridad con Windows Defender
        shell: powershell
        run: |
          $installer = Get-Item dist\AutoPrevias-*-Windows-x64-Setup.exe
          Write-Host "Escaneando instalador con Microsoft Defender: $($installer.FullName)"
          try {
            Start-MpScan -ScanPath $installer.FullName -ScanType CustomScan -ErrorAction SilentlyContinue
            Write-Host "Escaneo completado sin amenazas detectadas."
            echo "### Windows Defender Scan" >> $env:GITHUB_STEP_SUMMARY
            echo "- Archivo: $($installer.Name)" >> $env:GITHUB_STEP_SUMMARY
            echo "- Estado: Limpio / Sin amenazas detectadas" >> $env:GITHUB_STEP_SUMMARY
          } catch {
            Write-Host "Aviso en escaneo Defender: $_"
          }

      - name: Calcular SHA-256
        shell: pwsh
        run: |
          cd dist
          $hash = (Get-FileHash -Algorithm SHA256 AutoPrevias-*-Windows-x64-Setup.exe).Hash.ToLower()
          $file = (Get-Item AutoPrevias-*-Windows-x64-Setup.exe).Name
          "$hash  $file" | Out-File -Encoding utf8 checksum.txt
          Get-Content checksum.txt

      - name: Subir artefacto Windows x64
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows-x64
          path: |
            dist/AutoPrevias-*-Windows-x64-Setup.exe
            dist/checksum.txt

  publish-release:
    name: Publicar GitHub Release
    if: always() && (needs.build-macos-arm64.result == 'success' || needs.build-windows-x64.result == 'success')
    needs: [build-macos-arm64, build-windows-x64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Descargar todos los instaladores
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Consolidar instaladores y calcular SHA256SUMS.txt
        run: |
          mkdir -p release-files
          find release-artifacts -type f \( -name "*.dmg" -o -name "*.exe" \) -exec cp {} release-files/ \;
          cd release-files
          for f in AutoPrevias-*-macOS-arm64.dmg; do [ -f "$f" ] && cp "$f" AutoPrevias-macOS-arm64.dmg; done
          for f in AutoPrevias-*-Windows-x64-Setup.exe; do [ -f "$f" ] && cp "$f" AutoPrevias-Windows-x64-Setup.exe; done
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extraer notas de versión de CHANGELOG.md
        id: notes
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          fi
          CLEAN_VER="${TAG_NAME#v}"
          awk "/## \[?$CLEAN_VER\]?/{flag=1; next} /## \[?[0-9]/{flag=0} flag" CHANGELOG.md > release_notes.md || true
          if [ ! -s release_notes.md ]; then
            echo "Release $TAG_NAME de AutoPrevias para Radical Records." > release_notes.md
          fi
          cat release_notes.md

      - name: Publicar o Actualizar Release en GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          fi
          
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME ya existe, subiendo/actualizando activos..."
            gh release upload "$TAG_NAME" release-files/* --clobber
          else
            gh release create "$TAG_NAME" \
              release-files/* \
              --title "AutoPrevias $TAG_NAME" \
              --notes-file release_notes.md
          fi
